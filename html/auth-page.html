<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk / Daftar</title>
<link rel="stylesheet" href="../css/auth-page.css">
<link rel="stylesheet" href="../css/mobile.css">
<script src="../js/kemenham.js"></script>
</head>
<body>
<main class="card" data-mode="signup" id="card">

  <aside class="hero" id="hero" aria-roledescription="carousel" aria-label="Galeri gambar">
    <div class="track" id="track"></div>
    <div class="logo"><img src="../foo/logo/logo-kemenham.png" alt="Logo Kementerian Hak Asasi Manusia"></div>
    <button type="button" class="arrow prev" id="prev" aria-label="Gambar sebelumnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="arrow next" id="next" aria-label="Gambar berikutnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="dots" id="dots"></div>
  </aside>

  <section class="panel">
    <h1 id="title">Buat akun</h1>
    <p class="switch">
      <span class="only-signup">Sudah punya akun? <button type="button" data-go="login">Masuk</button></span>
      <span class="only-login">Belum punya akun? <button type="button" data-go="signup">Daftar</button></span>
    </p>

    <form id="auth-form" novalidate>
      <div class="row only-signup">
        <input type="text" name="first_name" placeholder="Nama depan" aria-label="Nama depan">
        <input type="text" name="last_name" placeholder="Nama belakang" aria-label="Nama belakang">
      </div>
      <input type="email" name="email" required placeholder="Email" aria-label="Email">
      <div class="row only-signup">
        <input type="tel" name="phone" placeholder="Nomor telepon" aria-label="Nomor telepon" inputmode="tel" autocomplete="tel">
        <select name="gender" aria-label="Jenis kelamin">
          <option value="" disabled selected hidden>Jenis kelamin</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div class="row only-signup">
        <input type="text" name="birth_place" placeholder="Tempat lahir" aria-label="Tempat lahir">
        <input type="date" name="birth_date" aria-label="Tanggal lahir">
      </div>
      <textarea class="only-signup" name="address" rows="2" placeholder="Alamat" aria-label="Alamat"></textarea>
      <div class="field">
        <input type="password" name="password" id="pw" placeholder="Masukkan kata sandi" aria-label="Kata sandi">
        <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="between only-login">
        <label class="check"><input type="checkbox"> <span>Ingat saya</span></label>
        <a href="#">Lupa kata sandi?</a>
      </div>

      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit"><span class="only-signup">Buat akun</span><span class="only-login">Masuk</span></button>
    </form>
  </section>
</main>

<script src="../js/auth-page.js"></script>
</body>
</html>
