<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk / Daftar</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #14213d;
    --muted: #6b7690;
    --blue: #1d4ed8;
    --blue-soft: #e8efff;
    --yellow: #facc15;
    --yellow-deep: #eab308;
    --line: #c7d4f5;

  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(960px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 14px;
    border: 2px solid var(--blue);
    border-radius: 20px;
    box-shadow: 8px 8px 0 var(--yellow);
    background: #fff;
  }

  /* ---------- Panel gambar (slider) ---------- */
  .hero {
    position: relative;
    min-height: 560px;
    border: 2px solid var(--yellow-deep);
    border-radius: 12px;
    background: var(--blue-soft);
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    cursor: grab;
  }
  .hero:active { cursor: grabbing; }
  .track { position: absolute; inset: 0; display: flex; transition: transform .5s ease; }
  .slide {
    flex: 0 0 100%; height: 100%;
    background-size: cover; background-position: center;
    display: grid; place-items: center;
  }
  .slide.ph {
    color: var(--blue); font-size: 14px; text-align: center; line-height: 1.5;
    background-color: var(--blue-soft);
    background-image:
      linear-gradient(to top right, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px)),
      linear-gradient(to top left, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px));
  }
  .slide.ph span { background: var(--blue-soft); padding: 8px 14px; border-radius: 8px; }

  .logo {
    position: absolute; top: 14px; left: 14px;
    width: 54px; height: 54px; display: grid; place-items: center;
    background: #fff; border: 1.5px solid var(--blue); border-radius: 12px; padding: 6px;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .back {
    position: absolute; top: 14px; right: 14px;
    font-size: 13px; text-decoration: none; color: var(--ink);
    background: #fff; border: 1.5px solid var(--blue);
    padding: 6px 12px; border-radius: 999px;
  }
  .back:hover { background: var(--yellow); }

  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; display: grid; place-items: center;
    background: #fff; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 50%; cursor: pointer;
  }
  .arrow:hover { background: var(--yellow); }
  .arrow:focus-visible, .dots button:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }
  .arrow.prev { left: 12px; } .arrow.next { right: 12px; }
  .hero.single .arrow, .hero.single .dots { display: none; }

  .dots { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .dots button {
    width: 28px; height: 6px; padding: 0; border-radius: 3px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--blue);
  }
  .dots button.on { background: var(--yellow); border-color: var(--yellow-deep); }

  /* ---------- Form ---------- */
  .panel { padding: 28px 28px 20px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .switch { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .switch button { all: unset; cursor: pointer; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .switch button:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }

  form { margin-top: 26px; display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { position: relative; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=date], select, textarea {
    width: 100%; height: 48px;
    padding: 0 14px;
    font: inherit; font-size: 14px; color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #9aa5c0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--yellow-deep); box-shadow: 0 0 0 3px #facc1566; }
  select { cursor: pointer; }
  select:invalid, input[type=date]:invalid { color: #9aa5c0; }
  textarea { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border: 0; background: none; cursor: pointer; color: var(--blue); border-radius: 6px;
  }
  .eye:focus-visible { outline: 2px solid var(--yellow-deep); }

  .check { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .check input { width: 18px; height: 18px; accent-color: var(--blue); }
  .check a { color: var(--blue); }
  .between { display: flex; justify-content: space-between; align-items: center; }
  .between a { font-size: 13px; color: var(--blue); }

  .primary {
    height: 48px; border: 2px solid var(--blue); border-radius: 8px;
    background: var(--blue); color: #fff; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    box-shadow: 0 4px 0 var(--yellow);
    transition: transform .1s, box-shadow .1s;
  }
  .primary:hover { background: #1a43b8; }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--yellow); }
  .primary:focus-visible { outline: 3px solid var(--yellow-deep); outline-offset: 3px; }

  [data-mode="login"] .only-signup, [data-mode="signup"] .only-login { display: none; }

  @media (max-width: 760px) {
    .card { grid-template-columns: 1fr; }
    .hero { min-height: 220px; }
    .panel { padding: 18px 8px; }
    .row { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .auth-err { color:#b91c1c; font-size:13px; font-weight:600; }
</style>
<script src="kemenham.js"></script>
</head>
<body>
<main class="card" data-mode="signup" id="card">

  <aside class="hero" id="hero" aria-roledescription="carousel" aria-label="Galeri gambar">
    <div class="track" id="track"></div>
    <div class="logo"><img src="logo-kemenham.png" alt="Logo Kementerian Hak Asasi Manusia"></div>
    <button type="button" class="arrow prev" id="prev" aria-label="Gambar sebelumnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="arrow next" id="next" aria-label="Gambar berikutnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="dots" id="dots"></div>
  </aside>

  <section class="panel">
    <h1 id="title">Buat akun</h1>
    <p class="switch">
      <span class="only-signup">Sudah punya akun? <button type="button" data-go="login">Masuk</button></span>
      <span class="only-login">Belum punya akun? <button type="button" data-go="signup">Daftar</button></span>
    </p>

    <form id="auth-form" novalidate>
      <div class="row only-signup">
        <input type="text" name="first_name" placeholder="Nama depan" aria-label="Nama depan">
        <input type="text" name="last_name" placeholder="Nama belakang" aria-label="Nama belakang">
      </div>
      <input type="email" name="email" required placeholder="Email" aria-label="Email">
      <div class="row only-signup">
        <input type="tel" name="phone" placeholder="Nomor telepon" aria-label="Nomor telepon" inputmode="tel" autocomplete="tel">
        <select name="gender" aria-label="Jenis kelamin">
          <option value="" disabled selected hidden>Jenis kelamin</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div class="row only-signup">
        <input type="text" name="birth_place" placeholder="Tempat lahir" aria-label="Tempat lahir">
        <input type="date" name="birth_date" aria-label="Tanggal lahir">
      </div>
      <textarea class="only-signup" name="address" rows="2" placeholder="Alamat" aria-label="Alamat"></textarea>
      <div class="field">
        <input type="password" name="password" id="pw" placeholder="Masukkan kata sandi" aria-label="Kata sandi">
        <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="between only-login">
        <label class="check"><input type="checkbox"> <span>Ingat saya</span></label>
        <a href="#">Lupa kata sandi?</a>
      </div>

      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit"><span class="only-signup">Buat akun</span><span class="only-login">Masuk</span></button>
    </form>
  </section>
</main>

<script>
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const pw = document.getElementById('pw');

  function setMode(mode) {
    card.dataset.mode = mode;
    title.textContent = mode === 'signup' ? 'Buat akun' : 'Selamat datang';
    pw.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    document.title = mode === 'signup' ? 'Daftar' : 'Masuk';
    // field khusus signup hanya wajib diisi saat mode daftar
    document.querySelectorAll('[name=gender], [name=birth_date]').forEach(el => el.required = mode === 'signup');
  }
  setMode(location.hash === '#login' ? 'login' : 'signup');
  document.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.go)));
  // buka halaman login langsung: auth-page.html#login

  document.getElementById('eye').addEventListener('click', () => {
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });


  /* ================= PENGATURAN SLIDER GAMBAR ================= */
  const SLIDES = [
    // 'gambar-1.jpg',
    // 'gambar-2.jpg',
    // 'gambar-3.jpg',
  ];
  const AUTOPLAY = true;   // false = hanya manual
  const INTERVAL = 4000;   // jeda geser otomatis (ms)

  const hero = document.getElementById('hero');
  const track = document.getElementById('track');
  const dotsEl = document.getElementById('dots');
  const items = SLIDES.length ? SLIDES : [null, null, null];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let index = 0, timer = null, startX = null, dx = 0;

  items.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (src ? '' : ' ph');
    if (src) slide.style.backgroundImage = `url("${src}")`;
    else slide.innerHTML = `<span>Gambar ${i + 1}<br>Isi di <code>SLIDES</code></span>`;
    track.appendChild(slide);

    const dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', `Gambar ${i + 1}`);
    dot.addEventListener('click', () => { go(i); restart(); });
    dotsEl.appendChild(dot);
  });
  if (items.length < 2) hero.classList.add('single');

  function go(i) {
    index = (i + items.length) % items.length;
    track.style.transform = `translateX(${-index * 100}%)`;
    [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === index));
  }
  function start() { if (AUTOPLAY && items.length > 1 && !reduceMotion) timer = setInterval(() => go(index + 1), INTERVAL); }
  function stop() { clearInterval(timer); }
  function restart() { stop(); start(); }

  document.getElementById('prev').addEventListener('click', () => { go(index - 1); restart(); });
  document.getElementById('next').addEventListener('click', () => { go(index + 1); restart(); });
  hero.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { go(index - 1); restart(); }
    if (e.key === 'ArrowRight') { go(index + 1); restart(); }
  });
  hero.addEventListener('mouseenter', stop);
  hero.addEventListener('mouseleave', start);

  // Geser manual (drag mouse / swipe jari)
  hero.addEventListener('pointerdown', e => {
    if (e.target.closest('button, a')) return;
    startX = e.clientX; dx = 0;
    track.style.transition = 'none';
    hero.setPointerCapture(e.pointerId);
    stop();
  });
  hero.addEventListener('pointermove', e => {
    if (startX === null) return;
    dx = e.clientX - startX;
    track.style.transform = `translateX(calc(${-index * 100}% + ${dx}px))`;
  });
  function endDrag() {
    if (startX === null) return;
    track.style.transition = '';
    const limit = hero.offsetWidth * 0.15;
    go(dx < -limit ? index + 1 : dx > limit ? index - 1 : index);
    startX = null; dx = 0;
    restart();
  }
  hero.addEventListener('pointerup', endDrag);
  hero.addEventListener('pointercancel', endDrag);

  go(0);
  start();


  /* ===== Masuk / daftar. Sementara memakai kemenham.js, nanti ganti dengan PHP ===== */
  if (window.KH) {
    const next = new URLSearchParams(location.search).get('next') || '';
    const tujuan = /^[\w()%.\- ]+\.html(#\w+)?$/.test(next) ? next : 'home.html';
    const errEl = document.getElementById('auth-err');
    document.getElementById('auth-form').addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target, v = n => f[n].value.trim();
      const salah = m => { errEl.textContent = m; errEl.hidden = false; };
      errEl.hidden = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) return salah('Masukkan alamat email yang valid.');
      if (!f.password.value) return salah('Kata sandi wajib diisi.');
      let pesan;
      if (card.dataset.mode === 'signup') {
        if (!v('first_name')) return salah('Nama depan wajib diisi.');
        if (!f.gender.value || !f.birth_date.value) return salah('Lengkapi jenis kelamin dan tanggal lahir.');
        pesan = KH.signup({ first_name: v('first_name'), last_name: v('last_name'), email: v('email'), phone: v('phone'),
          gender: f.gender.value, birth_place: v('birth_place'), birth_date: f.birth_date.value, address: v('address') });
      } else {
        pesan = KH.login(v('email'));
      }
      if (pesan) return salah(pesan);
      location.href = tujuan;
    });
  }
</script>
</body>
</html>
